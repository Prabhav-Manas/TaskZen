services:
  backend:
    image: taskzen-backend-prod

    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: taskzen-backend-prod

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

  frontend:
    image: taskzen-frontend-prod
    
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: taskzen-frontend-prod

    ports:
      - "4201:80"

    depends_on:
      - backend