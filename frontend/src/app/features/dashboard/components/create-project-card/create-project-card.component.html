<app-card>
    <div
        class="create-card  d-flex flex-column justify-content-center align-items-center text-center"
        (click)="open.emit()">

        <div class="add-create-project-icon">
            +
        </div>

        <h2 class="fw-bold mt-4 mb-3">
            Create New Project
        </h2>

        <p class="text-muted px-4 mb-4">
            Organize your work by creating a new project and start collaborating with your team.
        </p>

        <button
            class="btn btn-primary rounded-pill px-4 py-2">

            <i class="bi bi-plus-lg me-2"></i>

            {{label}}

        </button>

    </div>
</app-card>
